repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff-check
        name: ruff baseline
        args: [--select, "E9,F63,F7,F82,W605"]
      - id: ruff-check
        name: ruff strict new code
        args: [--select, "E,F,I,W"]
        files: ^(ui/routers/|tests/)
  - repo: local
    hooks:
      - id: pyright
        name: pyright
        entry: pyright
        language: system
        pass_filenames: false
        files: ^(ui/routers/|tests/)
      - id: pytest
        name: pytest
        entry: pytest -q
        language: system
        pass_filenames: false
