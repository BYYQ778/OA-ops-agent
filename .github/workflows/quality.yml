name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      OA_ENABLE_BACKGROUND_STARTUP: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.3"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install core and development dependencies
        run: uv sync --locked --dev
      - name: Ruff
        run: uv run ruff check .
      - name: Ruff strict scope for the new baseline
        run: uv run ruff check --select E,F,I,W ui/routers tests
      - name: Pyright scoped baseline
        run: uv run pyright
      - name: Tests and honest coverage report
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: coverage.xml
          if-no-files-found: warn
      - name: Compile Python sources
        run: uv run python -m compileall -q agents ui utils main.py desktop_app.py

  docker-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build core image without model extras
        run: docker build --target core -t oa-ops-agent:core .
      - name: Smoke-test core image health endpoint
        shell: bash
        run: |
          docker run --detach --name oa-ops-core \
            --env OA_ENABLE_BACKGROUND_STARTUP=0 \
            --publish 7860:7860 oa-ops-agent:core
          for attempt in {1..30}; do
            if docker exec oa-ops-core python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7860/api/health', timeout=2)"; then
              exit 0
            fi
            sleep 1
          done
          docker logs oa-ops-core
          exit 1
      - name: Remove smoke-test container
        if: always()
        run: docker rm --force oa-ops-core || true
